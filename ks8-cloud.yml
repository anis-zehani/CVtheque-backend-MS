#################### Deployment ####################
---
apiVersion: apps/v1 # for versions before 1.9.0 use apps/v1beta2
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend-container
        image: registry.gitlab.com/gitlabodix/cvtheque-backend-ms-prod
        args: ["--spring.profiles.active=prod"]
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
      imagePullSecrets:
      - name: gitlab-secrets-backend-ms
#################### Service ####################
---
apiVersion: v1
kind: Service
metadata:
  name: backend-ms
spec:
  selector:
    app: backend
  ports:
    - port: 8001
      targetPort: 8001

